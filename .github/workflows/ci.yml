name: ISH-Anatomi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install desktop dependencies
        run: npm install
      - name: Test local AI and safety boundaries
        run: npm test
      - name: Bootstrap pinned Human Atlas
        run: npm run atlas:bootstrap
      - name: Install Human Atlas
        run: npm run atlas:install
      - name: Validate Human Atlas
        run: npm run atlas:check
      - name: Build Human Atlas
        run: npm run atlas:build
