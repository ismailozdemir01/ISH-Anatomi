name: ISH-Anatomi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: npm install
      - name: Test local AI and clinical safety
        run: npm test
      - name: Test Python clinical core
        run: npm run test:python
      - name: Bootstrap pinned Human Atlas
        run: npm run atlas:bootstrap
      - name: Install Human Atlas
        run: npm run atlas:install
      - name: Validate Human Atlas
        run: npm run atlas:check
      - name: Build Human Atlas
        run: npm run atlas:build
