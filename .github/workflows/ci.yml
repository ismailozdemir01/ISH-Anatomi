name: ISH-Anatomi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize CI diagnostics
        run: |
          mkdir -p .ci
          node --version | tee .ci/node-version.txt
          npm --version | tee .ci/npm-version.txt
          python --version | tee .ci/python-version.txt
          uname -a | tee .ci/runner.txt
      - name: Install desktop dependencies
        run: npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee .ci/npm-install.log
      - name: Run isolated validation loop
        run: node scripts/ci-validation.mjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ish-anatomi-validation-report
          path: .ci/
          if-no-files-found: warn
      - name: Bootstrap pinned Human Atlas
        run: npm run atlas:bootstrap
      - name: Install Human Atlas
        run: npm run atlas:install
      - name: Validate Human Atlas
        run: npm run atlas:check
      - name: Build Human Atlas
        run: npm run atlas:build
