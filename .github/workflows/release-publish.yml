name: ISH-Anatomi Release Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: ish-anatomi-win
          - os: ubuntu-latest
            target: linux
            artifact: ish-anatomi-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install root dependencies
        run: npm install
      - name: Validate JavaScript modules
        run: npm test
      - name: Validate Python clinical extension
        run: npm run test:python
      - name: Prepare and validate real Human Atlas
        run: npm run desktop:prepare
      - name: Build installer/package
        run: npx electron-builder --${{ matrix.target }} --publish never
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ish-anatomi-win
          path: release
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: ish-anatomi-linux
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ISH-Anatomi ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
